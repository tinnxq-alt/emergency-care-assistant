<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>心跳骤停急救流程</title></head>
<body>
<main class="emergency-page">
<h1>❤️ 心跳骤停</h1>
<section>
<h2>快速判断</h2>
<p>确认患者反应、呼吸和循环状态，立即启动抢救流程。</p>
</section>
<section>
<h2>立即处理</h2>
<ul><li>呼叫支援</li><li>开始高质量胸外按压</li><li>连接监护与除颤设备</li><li>建立静脉通路</li></ul>
</section>
<section>
<h2>关键药物</h2>
<ul><li>肾上腺素（抢救车关联）</li><li>胺碘酮（特定心律失常场景）</li><li>利多卡因（特定心律失常场景）</li></ul>
</section>
<section>
<h2>可逆原因</h2>
<p>5H5T：低氧、低血容量、酸中毒、低/高钾、低体温、张力性气胸、心包填塞、毒物、肺栓塞、冠脉血栓。</p>
</section>
<section>
<h2>记录模板</h2>
<p>记录发现时间、开始CPR时间、除颤时间、给药时间、循环恢复情况。</p>
</section>
</main>
</body>
</html>
